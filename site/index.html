<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Interactive 3D map of the Haslital: Meiringen, Hasliberg, Grimsel, with places, hikes and filters in five languages.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Haslital 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D valley. Left: filters and Swiss hiking signposts. Right: the page for the valley, a region or a place. Phones: one bottom sheet. */
:root{
  --paper: rgba(246,248,246,.94);
  --paper-solid:#f5f7f5;
  --ink:#16201c;
  --muted:#55625c;
  --line:rgba(22,32,28,.14);
  --chip:rgba(22,32,28,.06);
  --sign:#f6c700;
  --sign-ink:#111;
  --trail:#d4232b;
  --pin:#16201c; --pin-ink:#fff;
  --c-hiking:#b4521f; --c-nature:#1f8a8a; --c-gorges:#2f62c9; --c-views:#c77d00; --c-culture:#8a4fc4; --c-lifts:#d4232b; --c-active:#3b8a2f;
  --sky-top:#8db8e0; --sky-mid:#cfe0ea; --sky-low:#e9efec; --haze:#dfe8ea;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(20,30,40,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper: rgba(18,22,30,.9); --paper-solid:#141923; --ink:#ecefe9; --muted:#9aa4a8; --line:rgba(236,239,233,.14); --chip:rgba(236,239,233,.07);
  --pin:#f2c400; --pin-ink:#111;
  --c-hiking:#f08a5d; --c-nature:#4cc3c3; --c-gorges:#7aa2ff; --c-views:#f2b544; --c-culture:#c39bf0; --c-lifts:#ff6b6b; --c-active:#7ccf6c;
  --sky-top:#0d1424; --sky-mid:#2c2f45; --sky-low:#7b5c55; --haze:#4d4652;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper: rgba(18,22,30,.9); --paper-solid:#141923; --ink:#ecefe9; --muted:#9aa4a8; --line:rgba(236,239,233,.14); --chip:rgba(236,239,233,.07);
  --pin:#f2c400; --pin-ink:#111;
  --c-hiking:#f08a5d; --c-nature:#4cc3c3; --c-gorges:#7aa2ff; --c-views:#f2b544; --c-culture:#c39bf0; --c-lifts:#ff6b6b; --c-active:#7ccf6c;
  --sky-top:#0d1424; --sky-mid:#2c2f45; --sky-low:#7b5c55; --haze:#4d4652;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--paper-solid);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
#sky{position:fixed;inset:0;background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
button,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.panel{background:var(--paper);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:4px;box-shadow:var(--shadow)}

/* ---------- grid ---------- */
#ui{position:fixed;inset:0;pointer-events:none;display:grid;gap:12px;
  padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  grid-template-columns:minmax(0,320px) 1fr minmax(0,430px);grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "explore . page"}
#ui>*{pointer-events:auto}
.top{grid-area:top;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{padding:9px 14px 10px}
.brand h1{margin:0;font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:24px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand p{margin:5px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.tool{appearance:none;border:1px solid var(--line);background:var(--paper);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:4px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:7px;min-height:38px}
.tool:hover{border-color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.tool svg{width:14px;height:14px;flex:none}
.langs{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);overflow:hidden;min-height:38px}
.langs button{appearance:none;border:0;background:none;padding:0 9px;font-family:var(--font-mono);font-size:12px;font-weight:500;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper-solid)}

/* ---------- explore ---------- */
.explore{grid-area:explore;display:flex;flex-direction:column;min-height:0;padding:12px 12px 6px;align-self:start;max-height:100%}
.explore .mob-welcome{display:none}
.fgroup{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.flabel{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{appearance:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper-solid);border-color:var(--ink)}
.chip svg{width:14px;height:14px;flex:none}
.chip .dot{width:8px;height:8px;border-radius:2px;flex:none}
.reshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 6px}
.reshead strong{font-family:var(--font-display);font-stretch:110%;font-size:15px}
.linkbtn{appearance:none;border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline;cursor:pointer}
.list{overflow:auto;display:flex;flex-direction:column;gap:5px;padding:2px 14px 8px 0;min-height:0;scrollbar-width:thin}
.sign{appearance:none;border:0;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;
  background:var(--sign);color:var(--sign-ink);text-align:left;padding:6px 24px 6px 9px;min-height:36px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);
  font-family:var(--font-display);font-stretch:88%;font-weight:700;font-size:14px;line-height:1.15;transition:transform .18s ease;flex-shrink:0}
.sign:hover{transform:translateX(4px)}
.sign[aria-current="true"]{transform:translateX(8px);background:var(--ink);color:var(--paper-solid)}
.sign .km{font-family:var(--font-mono);font-weight:500;font-size:11px;font-stretch:100%;white-space:nowrap}
.sign .dot{width:9px;height:9px;border-radius:2px;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.empty{font-size:13.5px;color:var(--muted);padding:6px 0}

/* ---------- page ---------- */
.page{grid-area:page;align-self:start;max-height:100%;overflow:auto;padding:16px 20px 14px;min-width:0;scrollbar-width:thin}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.crumbs button{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-transform:inherit;letter-spacing:inherit;font:inherit;color:inherit}
.x{appearance:none;border:1px solid var(--line);background:transparent;border-radius:3px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;flex:none}
.x:hover{border-color:var(--ink)}
.page h2{margin:4px 0 2px;font-family:var(--font-display);font-stretch:112%;font-weight:800;font-size:28px;line-height:1.05;text-wrap:balance}
.tag{margin:0 0 12px;color:var(--muted);font-weight:600;font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:3px;background:var(--chip);border:1px solid var(--line)}
.badge svg{width:14px;height:14px}
.badge.cat .dot{width:8px;height:8px;border-radius:2px}
.page h3{margin:16px 0 6px;font-family:var(--font-mono);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.page p.body{margin:0;max-width:62ch}
.hl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.hl li{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:start}
.hl li::before{content:"";width:8px;height:8px;margin-top:7px;background:var(--sign);box-shadow:0 0 0 1.5px var(--sign-ink);transform:rotate(45deg)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.links{display:flex;flex-direction:column;gap:6px}
.lnk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;text-decoration:none;font-weight:600;font-size:14px}
.lnk:hover{border-color:var(--ink)}
.lnk small{font-family:var(--font-mono);font-weight:400;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.lnk.primary{background:var(--ink);color:var(--paper-solid);border-color:var(--ink)}
.lnk.primary small{color:inherit;opacity:.7}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{appearance:none;text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:3px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.card:hover{border-color:var(--ink)}
.card b{font-family:var(--font-display);font-stretch:95%;font-size:14px;line-height:1.2}
.card span{font-size:12px;color:var(--muted);line-height:1.3}
.card.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px}
.card.wide .dot{width:9px;height:9px;border-radius:2px;flex:none}
.card.wide div{display:flex;flex-direction:column;min-width:0}
.pnav{display:flex;gap:8px;margin-top:16px;align-items:center}
.pnav button{flex:1;appearance:none;border:1px solid var(--line);background:transparent;border-radius:3px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13.5px}
.pnav button:hover{border-color:var(--ink)}
.pnav span{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.mk{display:inline-block;width:18px;height:9px;border-radius:1px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.mk-hiking{width:10px;height:10px;background:#f6c700;transform:rotate(45deg);margin:0 4px}
.mk-mountain{background:linear-gradient(90deg,#fff 0 33%,#d4232b 33% 67%,#fff 67%)}
.mk-alpine{background:linear-gradient(90deg,#fff 0 33%,#2f62c9 33% 67%,#fff 67%)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.stat{background:var(--paper-solid);padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stat span{font-size:11.5px;color:var(--muted)}
.stat b{font-family:var(--font-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat.wide{grid-column:span 3;flex-direction:row;justify-content:space-between;align-items:center}
.stat.wide b{font-family:var(--font-body);font-size:13.5px;font-weight:600}
.profile{width:100%;height:auto;display:block;margin-top:8px}
.profile text{font-family:var(--font-mono);font-size:10px;fill:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.kicker{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:12px 0 0}
.credit{margin:14px 0 0;font-size:10.5px;line-height:1.4;color:var(--muted)}

/* ---------- labels ---------- */
.pin{position:absolute;left:0;top:0;pointer-events:auto;appearance:none;border:0;background:none;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;will-change:transform;transition:opacity .25s}
.pin .lab{display:flex;align-items:center;gap:6px;background:var(--pin);color:var(--pin-ink);border-radius:3px;padding:4px 8px 4px 6px;
  font-family:var(--font-display);font-stretch:90%;font-weight:700;font-size:12.5px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pin .lab i{width:9px;height:9px;border-radius:2px;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.pin .stem{width:2px;height:20px;background:var(--pin)}
.pin .foot{width:8px;height:8px;border-radius:50%;background:var(--pin);margin-top:-3px;box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.pin.on .lab{background:var(--sign);color:var(--sign-ink)}
.pin.on .stem{height:40px}
.pin.compact .lab{padding:4px;gap:0;font-size:0}
.pin.compact .stem{height:10px}
.peak{position:absolute;left:0;top:0;font-family:var(--font-mono);font-size:11px;color:#fff;white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 6px rgba(0,0,0,.5);transition:opacity .3s;pointer-events:none}
.peak::before{content:"▲ ";font-size:8px}
.peak span{opacity:.8}
.rlabel{position:absolute;left:0;top:0;pointer-events:auto;appearance:none;border:0;background:none;cursor:pointer;padding:2px 4px;
  font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.55);transition:opacity .3s;white-space:nowrap}
.rlabel:hover{color:var(--sign)}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper-solid);z-index:5;transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
.load-box{width:min(320px,80vw);font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.load-box strong{display:block;font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:22px;color:var(--ink);text-transform:uppercase;margin-bottom:10px}
.bar{height:6px;background:var(--line);margin:10px 0 6px;overflow:hidden;border-radius:3px}
.bar i{display:block;height:100%;width:0;background:var(--sign);transition:width .3s}
#err{color:var(--trail)}

/* ---------- phone ---------- */
@media (max-width:960px){
  #ui{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "." "sheet";gap:8px}
  .brand{padding:7px 10px}
  .brand h1{font-size:18px}
  .brand p{display:none}
  .tool{padding:6px 9px;font-size:12.5px;min-height:34px}
  .tool .tl{display:none}
  .langs{min-height:34px}
  .langs button{padding:0 6px;font-size:11px}
  .explore,.page{grid-area:sheet;max-height:48vh;align-self:end}
  body.expanded .explore, body.expanded .page{max-height:82vh}
  body.has-page .explore{display:none}
  body:not(.has-page) .page{display:none}
  .explore{overflow:auto;padding:10px 12px 6px}
  .explore .mob-welcome{display:block;margin:0 0 8px}
  .explore .mob-welcome h2{margin:0;font-family:var(--font-display);font-stretch:112%;font-weight:800;font-size:20px;line-height:1.1}
  .explore .mob-welcome p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
  .list{overflow:visible;padding-right:14px}
  .page{padding:12px 14px 12px}
  .page h2{font-size:22px}
  .cards{grid-template-columns:1fr}
  .grab{display:flex;justify-content:center;margin:-4px 0 6px}
  .grab button{appearance:none;border:0;background:none;padding:4px 20px;cursor:pointer}
  .grab button i{display:block;width:40px;height:4px;border-radius:2px;background:var(--line)}
}
@media (min-width:961px){ .grab{display:none} }
@media (prefers-reduced-motion: reduce){ .sign,.pin,#loader,.peak,.rlabel{transition:none} }
</style>

</head>
<body>
<div id="sky"></div>
<canvas id="c" tabindex="0" aria-label="3D map of the Haslital"></canvas>
<div id="labels"></div>

<div id="ui">
  <header class="top">
    <div class="brand panel">
      <h1>Haslital</h1>
      <p id="t-brandSub">Meiringen · Hasliberg · Grimsel</p>
    </div>
    <div class="tools">
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
      <button class="tool" id="b-overview" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M1 13 6 5l3 4 2-3 4 7z"/></svg><span class="tl" id="t-overview">Whole valley</span></button>
      <button class="tool" id="b-tour" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg><span class="tl" id="t-tour">Tour</span></button>
    </div>
  </header>

  <section class="explore panel" id="explore" aria-label="Explore">
    <div class="grab"><button type="button" class="b-expand" aria-label="Expand"><i></i></button></div>
    <div class="mob-welcome"><h2 id="m-title"></h2><p id="m-text"></p></div>
    <div class="fgroup"><span class="flabel" id="t-regions"></span><div class="chips" id="f-region"></div></div>
    <div class="fgroup"><span class="flabel" id="t-categories"></span><div class="chips" id="f-cat"></div></div>
    <div class="fgroup"><span class="flabel" id="t-filters"></span><div class="chips" id="f-feat"></div></div>
    <div class="reshead"><strong id="r-count"></strong><button type="button" class="linkbtn" id="b-clear"></button></div>
    <nav class="list" id="list" aria-label="Places"></nav>
  </section>

  <article class="page panel" id="page" aria-live="polite"></article>
</div>

<div id="loader" role="status">
  <div class="load-box">
    <strong>Haslital</strong>
    <span id="l-text">Loading the Haslital</span>
    <div class="bar"><i id="l-bar"></i></div>
    <span id="err"></span>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

const $ = s => document.querySelector(s);
const LANGS = ['en','de','fr','it','es'];
const STATION = { lon:8.18427, lat:46.72736 };
const CATS = ['hiking','nature','gorges','views','culture','lifts','active'];
const FEATS = ['wheelchair','dogs','family','indoor','free'];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rad = d => d*Math.PI/180;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON = {

let seed = 12345; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
{

  const plaster = new THREE.Color(0xe9e3d6), wood = new THREE.Color(0x7d5131), c = new THREE.Color(), cd = new THREE.Color();
  const wall = (ax,az,bx,bz,yb,yt) => { wp.push(ax,yb,az, bx,yb,bz, bx,yt,bz, ax,yb,az, bx,yt,bz, ax,yt,az); const lo = cd.toArray(), hi = c.toArray(); wc.push(...lo,...lo,...hi, ...lo,...hi,...hi); };
  const gtri = (p,q,r) => { for (const v of [p,q,r]) wp.push(...v); const hi = c.toArray(); wc.push(...hi,...hi,...hi); };
  let i = 0;

  let s;
  if (c.loop) s = ((time*c.speed/c.total + c.off) % 1) * c.total;
  else { const ph = (time*c.speed/(c.total*1.25)) % 2, u = Math.min(1, Math.max(0, (ph < 1 ? ph : 2-ph)*1.25 - 0.125)); s = (0.5 - 0.5*Math.cos(u*Math.PI)) * c.total; }

  const f = (s - c.cum[lo]) / Math.max(1e-6, c.cum[hi]-c.cum[lo]);
  c.m.position.lerpVectors(c.pts[lo], c.pts[hi], f);
  c.m.rotation.y = Math.atan2(c.pts[hi].x - c.pts[lo].x, c.pts[hi].z - c.pts[lo].z);
}

const labels = $('#labels');
for (const p of PLACES){
  const pin = document.createElement('button'); pin.className = 'pin'; pin.type = 'button'; pin.tabIndex = -1;
  pin.innerHTML = `<span class="lab"><i style="background:var(--c-${p.cats[0]})"></i><span></span></span><span class="stem"></span><span class="foot"></span>`;
  pin.addEventListener('click', () => { stopTour(); go(p.id); });
  labels.appendChild(pin); p.pin = pin; p.pinName = pin.querySelector('.lab span'); p.anchor = new THREE.Vector3(p.x, p.h + 2, p.z);
}
const rlabels = REGIONS.filter(r => r.places.length).map(r => {
  const el = document.createElement('button'); el.className = 'rlabel'; el.type = 'button'; el.tabIndex = -1;
  el.addEventListener('click', () => { stopTour(); go(r.id); }); labels.appendChild(el);
  return { id:r.id, el, anchor:new THREE.Vector3(r.x, heightAt(r.x, r.z) + 1600, r.z) };
});
const peaks = meta.peaks.filter(p => p.e >= 2300).sort((a,b) => b.e - a.e).map(p => {
  const el = document.createElement('div'); el.className = 'peak'; el.innerHTML = `${esc(p.n)} <span>${p.e}</span>`; labels.appendChild(el);
  return { ...p, el, anchor:new THREE.Vector3(p.x, heightAt(p.x, p.z) + 6, p.z) };
});
function updatePins(){ for (const p of PLACES){ p.visible = matches(p) || state.page === p.id; p.pin.classList.toggle('on', state.page === p.id); } }

const v3 = new THREE.Vector3();
function occluded(p){ const c = camera.position; for (let k=2;k<30;k++){ const f = k/30, x = c.x+(p.x-c.x)*f, y = c.y+(p.y-c.y)*f, z = c.z+(p.z-c.z)*f; if (heightAt(x,z) > y + 4) return true; } return false; }
let frame = 0;
function project(a){ v3.copy(a).project(camera); if (v3.z > 1 || Math.abs(v3.x) > 1.1 || Math.abs(v3.y) > 1.1) return null; return [(v3.x*.5+.5)*innerWidth, (-v3.y*.5+.5)*innerHeight, v3.z]; }
function updateLabels(){
  frame++;
  const camDist = camera.position.distanceTo(controls.target), boxes = [];
  const order = [...PLACES].sort((a,b) => (b.id === state.page) - (a.id === state.page));
  for (const p of order){
    const s = p.visible && project(p.anchor);
    if (!s){ p.pin.style.opacity = 0; p.pin.style.pointerEvents = 'none'; continue; }
    const [x, y, z] = s;
    if (frame % 3 === 0) p.occ = occluded(p.anchor);
    if (!p.lw) p.lw = p.pin.firstElementChild.offsetWidth || 140;
    const on = p.id === state.page, lh = on ? 64 : 44, box = [x - p.lw/2, y - lh - 22, x + p.lw/2, y - lh + 4];
    const hit = !on && (camDist > 22000 || boxes.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1]));
    p.pin.classList.toggle('compact', hit);
    boxes.push(hit ? [x-10, box[1], x+10, box[3]] : box);
    p.pin.style.transform = `translate(${x}px, ${y}px) translate(-50%, calc(-100% + 4px))`;
    p.pin.style.opacity = p.occ && !on ? 0.3 : 1; p.pin.style.pointerEvents = 'auto';
    p.pin.style.zIndex = on ? 1000 : Math.round(900 - z*400);
  }
  for (const r of rlabels){
    const s = camDist > 7000 && project(r.anchor);
    if (!s){ r.el.style.opacity = 0; r.el.style.pointerEvents = 'none'; continue; }
    r.el.style.opacity = state.region === r.id || state.region === 'all' ? 1 : 0.55; r.el.style.pointerEvents = 'auto';
    r.el.style.transform = `translate(${s[0]}px, ${s[1]}px) translate(-50%, -50%)`;
    boxes.push([s[0]-80, s[1]-14, s[0]+80, s[1]+14]);
  }
  const placed = [];
  for (const p of peaks){
    const s = project(p.anchor), dd = camera.position.distanceTo(p.anchor);
    if (!s || dd > 30000){ p.el.style.opacity = 0; continue; }
    const [x, y] = s;
    if (frame % 4 === 0) p.occ = occluded(p.anchor);
    const clash = placed.some(q => Math.abs(q[0]-x) < 120 && Math.abs(q[1]-y) < 22) || boxes.some(b => x+50 > b[0] && x-50 < b[2] && y > b[1]-6 && y-16 < b[3]+30);
    if (p.occ || clash || (camDist > 15000 && p.e < 3000) || (camDist < 1200 && dd > 8000)){ p.el.style.opacity = 0; continue; }
    placed.push([x,y]); p.el.style.opacity = 1; p.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
  }
}

/* ---------------------------------------------------------------- camera */
const OVERVIEW = { x:-1200, y:1400, z:1200, az:8, el:50, dist:33000 };
const mobile = () => innerWidth <= 960;
function viewFor(id){
  if (!id) return { ...OVERVIEW, dist: OVERVIEW.dist * (mobile() ? 1.3 : 1) };
  const r = regionById[id];
  if (r) return { x:r.x, y:heightAt(r.x, r.z), z:r.z, az:10, el:48, dist:Math.max(3500, r.ext*3.2) * (mobile() ? 1.35 : 1) };
  const p = byId[id], v = p.view;
  if (!v){ const r = p.r; return { x:r.cx, y:heightAt(r.cx, r.cz), z:r.cz, az:10, el:50, dist:Math.max(1600, r.ext*1.9) * (mobile() ? 1.35 : 1) }; }
  return { x:p.x, y:p.h + (v.ty||0), z:p.z, az:v.az, el:v.el, dist:v.dist * (mobile() ? 1.3 : 1) };
}
function camState(){ const off = camera.position.clone().sub(controls.target), d = off.length();
  return { x:controls.target.x, y:controls.target.y, z:controls.target.z, dist:d, el:Math.asin(off.y/d)*180/Math.PI, az:Math.atan2(off.x, off.z)*180/Math.PI }; }
function setCam(v){ const e = rad(v.el), a = rad(v.az); controls.target.set(v.x, v.y, v.z);
  camera.position.set(v.x + Math.sin(a)*Math.cos(e)*v.dist, v.y + Math.sin(e)*v.dist, v.z + Math.cos(a)*Math.cos(e)*v.dist); camera.lookAt(controls.target); }
let flight = null;
function flyTo(v, ms){
  const a = camState(); let daz = v.az - a.az; daz = ((daz + 540) % 360) - 180;
  const travel = Math.hypot(v.x-a.x, v.z-a.z), bump = Math.min(1.2, travel / Math.max(a.dist, v.dist) * 0.7);
  ms = reduceMotion ? 0 : (ms ?? Math.min(4500, 1600 + travel*0.18));
  flight = { a, v, daz, bump, t0:performance.now(), ms };
}
function stepFlight(now){
  if (!flight) return;
  const { a, v, daz, bump, t0, ms } = flight, s = ms ? Math.min(1, (now-t0)/ms) : 1, e = s < .5 ? 4*s*s*s : 1 - Math.pow(-2*s+2, 3)/2;
  const dist = Math.exp(Math.log(a.dist) + (Math.log(v.dist) - Math.log(a.dist))*e) * (1 + bump*Math.sin(Math.PI*s));
  setCam({ x:a.x+(v.x-a.x)*e, y:a.y+(v.y-a.y)*e, z:a.z+(v.z-a.z)*e, az:a.az+daz*e, el:a.el+(v.el-a.el)*e + bump*8*Math.sin(Math.PI*s), dist });
  if (s >= 1) flight = null;
}
controls.addEventListener('start', () => { flight = null; stopTour(); });

let tourTimer = null;
function stopTour(){ if (tourTimer){ clearInterval(tourTimer); tourTimer = null; $('#b-tour').setAttribute('aria-pressed', 'false'); } }
$('#b-tour').addEventListener('click', () => { if (tourTimer){ stopTour(); return; } $('#b-tour').setAttribute('aria-pressed','true'); step(1); tourTimer = setInterval(() => step(1), 9000); });
$('#b-overview').addEventListener('click', () => { stopTour(); state.cat = 'all'; state.feat.clear(); go(''); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea,select')) return;
  if (e.key === 'ArrowRight'){ stopTour(); step(1); } else if (e.key === 'ArrowLeft'){ stopTour(); step(-1); } else if (e.key === 'Escape' && state.page){ stopTour(); go(''); }
});

/* keep the subject centred in the free part of the screen */
function applyViewOffset(){
  const w = innerWidth, h = innerHeight; let sx = 0, sy = 0;
  if (mobile()){ const sheet = (document.body.classList.contains('has-page') ? $('#page') : $('#explore')).getBoundingClientRect(); sy = Math.max(0, (h - sheet.top) * 0.45); }
  else { const l = $('#explore').getBoundingClientRect(), r = $('#page').getBoundingClientRect(); sx = ((w - r.left) - l.right) / 2; }
  camera.setViewOffset(w, h, sx, sy, w, h);
}
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.fov = innerWidth < 600 ? 55 : 42; camera.updateProjectionMatrix(); applyViewOffset(); }
addEventListener('resize', resize);

/* ---------------------------------------------------------------- start */
renderStatic();
setCam({ ...OVERVIEW, az:OVERVIEW.az - 40, el:64, dist:60000 });
route();
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  stepFlight(performance.now());
  if (!flight){
    controls.update();
    const tg = controls.target; tg.x = Math.max(-W/2, Math.min(W/2, tg.x)); tg.z = Math.max(-H/2, Math.min(H/2, tg.z));
    const g = heightAt(camera.position.x, camera.position.z) + 25; if (camera.position.y < g) camera.position.y = g;
  }
  if (frame % 10 === 0){
    applyViewOffset();
    const c = camera.position;
    for (const tl of tiles){
      const dx = Math.max(tl.x0 - c.x, 0, c.x - tl.x1), dz = Math.max(tl.z0 - c.z, 0, c.z - tl.z1);
      const d = Math.hypot(dx, dz, Math.max(0, c.y - 1500));
      if (d < 9000 && !tl.hi) loadHi(tl);
      const vis = d < 7500; for (const m of tl.trees) m.visible = vis;
    }
  }
  const time = clock.getElapsedTime();
  for (const c of cabins) placeCabin(c, time);
  renderer.render(scene, camera);
  updateLabels();
});
$('#loader').classList.add('done');
</script>
